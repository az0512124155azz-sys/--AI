<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="panel-header">
    <div class="header-left">
      <span class="logo">&#10022;</span>
      <span class="title">AI Agent</span>
    </div>
    <div class="header-right">
      <button id="settings-btn" class="icon-btn" title="הגדרות">&#9881;</button>
      <button id="clear-btn" class="icon-btn" title="שיחה חדשה">+</button>
    </div>
  </header>

  <div class="controls">
    <select id="provider-select" title="ספק">
      <option value="gemini">Gemini</option>
      <option value="openrouter">OpenRouter</option>
      <option value="chatgpt-web">ChatGPT (המנוי שלי)</option>
    </select>
    <select id="model-select" title="מודל">
      <option value="">טוען...</option>
    </select>
  </div>

  <div id="context-bar" class="context-bar hidden">
    <span class="context-icon">&#128204;</span>
    <span id="context-text" class="context-text"></span>
    <button id="clear-context" class="context-clear" title="הסר">&#10005;</button>
  </div>

  <main id="chat-container" class="chat-container"></main>

  <div id="file-preview" class="file-preview hidden"></div>

  <footer class="input-area">
    <button id="attach-btn" class="icon-btn" title="צרף קובץ">&#128206;</button>
    <input type="file" id="file-input" hidden multiple
           accept=".txt,.md,.json,.js,.css,.html,.csv,.pdf,.docx,image/*">
    <textarea id="message-input"
              placeholder="שאל שאלה או בקש לשלוט בדפדפן..."
              rows="1"></textarea>
    <button id="send-btn" class="send-btn" title="שלח">&#10148;</button>
  </footer>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>הגדרות</h2>
        <button id="close-settings" class="icon-btn">&#10005;</button>
      </div>
      <label>
        <span>Gemini API Key</span>
        <input type="password" id="gemini-key" placeholder="AIza...">
      </label>
      <label>
        <span>OpenRouter API Key</span>
        <input type="password" id="openrouter-key" placeholder="sk-or-...">
      </label>
      <label>
        <span>System Prompt</span>
        <textarea id="system-prompt" rows="6"></textarea>
      </label>
      <button id="save-settings" class="primary-btn">שמור</button>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
