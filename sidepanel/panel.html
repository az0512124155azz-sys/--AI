<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>AI Agent</title>
  <link rel="stylesheet" href="panel.css"/>
</head>
<body>
  <div class="shell" id="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="35%" stop-color="#9B72CB"/>
              <stop offset="70%" stop-color="#D96570"/>
              <stop offset="100%" stop-color="#D96570"/>
            </linearGradient>
          </defs>
          <path fill="url(#g)" d="M12 2l1.4 5.8L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.2L12 2z"/>
        </svg>
        <span>AI Agent</span>
      </div>
      <button type="button" class="icon-btn" id="btnNew" title="שיחה חדשה" aria-label="שיחה חדשה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnSet" title="הגדרות" aria-label="הגדרות">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <div class="scroll" id="scroll">
      <div class="home" id="home">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="40%" stop-color="#9B72CB"/>
              <stop offset="100%" stop-color="#D96570"/>
            </linearGradient>
          </defs>
          <path fill="url(#g2)" d="M12 2l1.4 5.8L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.2L12 2z"/>
        </svg>
        <h1>היי</h1>
        <p>במה אפשר לעזור?</p>
      </div>
      <div class="sugs" id="sugs">
        <button type="button" data-q="סכם את הדף הנוכחי">סכם את הדף</button>
        <button type="button" data-q="מה הטאבים הפתוחים?">טאבים פתוחים</button>
        <button type="button" data-q="תרגם את הטקסט שסימנתי">תרגם סימון</button>
      </div>
      <div class="msgs" id="msgs"></div>
    </div>

    <div class="attachments" id="atts"></div>

    <div class="composer">
      <div class="pill">
        <button type="button" class="tool" id="btnAtt" title="צרף" aria-label="צרף קובץ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="שאל את Gemini"></textarea>
        <div class="side">
          <select id="model" aria-label="מודל" title="מודל"></select>
          <button type="button" class="go" id="btnSend" disabled title="שלח" aria-label="שלח">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
      <div class="meta-line">
        <select id="provider" aria-label="ספק">
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI API</option>
          <option value="openrouter">OpenRouter</option>
          <option value="chatgpt">ChatGPT Web</option>
        </select>
        <span>·</span>
        <span>AI Browser Agent</span>
      </div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-label="הגדרות">
      <header>
        <div class="logo"><span>הגדרות</span></div>
        <button type="button" class="icon-btn" id="btnClose" aria-label="סגור">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="body">
        <label for="kG">מפתח Gemini</label>
        <input id="kG" type="password" placeholder="AIza…" autocomplete="off"/>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">קבל מפתח</a>

        <label for="kOA">מפתח OpenAI API</label>
        <input id="kOA" type="password" placeholder="sk-…" autocomplete="off"/>
        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">קבל מפתח ב-Platform</a>

        <label for="kO">מפתח OpenRouter</label>
        <input id="kO" type="password" placeholder="sk-or-…" autocomplete="off"/>
        <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">קבל מפתח</a>

        <label>ChatGPT Web</label>
        <p style="font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.45">
          שליחה דרך הטאב של chatgpt.com (מחובר בדפדפן). לא דורש מפתח API.
        </p>
        <button type="button" id="btnCgptLogin" class="save" style="width:100%;margin-bottom:18px">
          פתח ChatGPT
        </button>

        <label for="sys">הנחיית מערכת</label>
        <textarea id="sys">אתה סוכן דפדפן. ענה בעברית, קצר ומדויק.</textarea>
      </div>
      <footer>
        <button type="button" class="cancel" id="btnCancel">ביטול</button>
        <button type="button" class="save" id="btnSave">שמור</button>
      </footer>
    </div>

    <input type="file" id="fileIn" hidden multiple/>
  </div>
  <script src="panel.js"></script>
</body>
</html>
